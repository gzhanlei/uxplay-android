plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codelphi.airplay'

    compileSdk 34

    defaultConfig {
        applicationId 'com.codelphi.airplay'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'

        ndk { abiFilters 'armeabi-v7a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   /* release 也用 debug 签名，便于直接侧载 */
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/*.md', 'META-INF/DEPENDENCIES']
        }
    }
}

/* 刻意不引入任何依赖：这台索尼电视的 ROM 不加载 classes.dex 以外的 dex，
   无第三方依赖可保证 dex 天然只有一个 */
